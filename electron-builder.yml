# ============================================================================
# Local Desk — Electron Builder Configuration (Development / Unsigned Default)
# Compatible with electron-builder v24.x / v25.x
#
# Note on Environment Variables:
# - Electron Builder natively reads: WIN_CSC_LINK (or CSC_LINK) and
#   WIN_CSC_KEY_PASSWORD (or CSC_KEY_PASSWORD). When unset and
#   forceCodeSigning is false, Electron Builder produces unsigned Windows
#   NSIS and Portable builds without failing.
# - Custom pipeline variables (FORCE_CODE_SIGNING, ALLOW_UNSIGNED_DEV_BUILDS,
#   WIN_PUBLISHER_NAME, WIN_TIMESTAMP_SERVER) are consumed by
#   scripts/authenticode_signer.ts and scripts/build_windows_release.ts.
# ============================================================================
appId: com.localdesk.pdfstudio
productName: Local Desk
executableName: Local Desk
copyright: Copyright (C) 2026 Local Desk Studio
asar: true
compression: normal

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - build/icon.ico
  - build/local-desk-icon-v103.ico
  - electron/main.cjs
  - electron/preload.cjs
  - package.json

asarUnpack:
  - dist/ocr/**/*
  - build/icon.ico
  - build/local-desk-icon-v103.ico

win:
  icon: build/icon.ico
  executableName: Local Desk
  legalTrademarks: "Local Desk is a trademark of Local Desk Studio"
  fileDescription: "Local Desk — All-in-One PDF & Document Studio"
  # Development build default: do not require a signing certificate locally.
  # Production releases use electron-builder.prod.yml (forceCodeSigning: true).
  forceCodeSigning: false
  signAndEditExecutable: true
  signingHashAlgorithms:
    - sha256
  timeStampServer: "http://timestamp.digicert.com"
  rfc3161TimeStampServer: "http://timestamp.digicert.com"
  # Ready for Azure Trusted Signing / SignPath / Free Open-Source Certificate:
  # azureSignOptions:
  #   endpoint: "https://eus.codesigning.azure.net"
  #   codeSigningAccountName: "local-desk-signing"
  #   certificateProfileName: "local-desk-public-trust"
  #   publisherName: "Local Desk Studio"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  fileAssociations:
    - ext: pdf
      name: PDF Document
      description: Local Desk — All-in-One PDF & Document Studio
      role: Editor
      icon: build/icon.ico

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Local Desk
  uninstallDisplayName: Local Desk — All-in-One PDF & Document Studio
  deleteAppDataOnUninstall: false
  artifactName: "Local-Desk-Setup-${version}-${arch}.${ext}"

portable:
  artifactName: "Local-Desk-Portable-${version}-${arch}.${ext}"
