name: Deploy THE DESK landing to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'public/brand/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage public site (THE DESK landing, designs excluded)
        run: |
          mkdir -p site/brand
          cp landing/index.html site/index.html
          cp -r landing/assets site/assets
          cp public/brand/local-desk-app-icon.svg site/brand/local-desk-app-icon.svg
          # dev-server-only paths -> standalone site paths
          sed -i 's|\.\./public/brand/local-desk-app-icon\.svg|brand/local-desk-app-icon.svg|g' site/index.html
          # the live demo needs the local dev server; public visitors get the release page
          sed -i 's|href="/demo/"|href="https://github.com/r3haanM/LocalDesk/releases/latest"|g' site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
