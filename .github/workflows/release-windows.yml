name: Windows x64 Release Pipeline (QA-gated)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: QA-gated Windows x64 Release (NSIS + Portable + SHA256SUMS)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-Check and Lint
        run: npm run lint

      - name: Ensure Electron Runtime Binary (for bundled runtime packaging)
        run: node node_modules/electron/install.js

      - name: 'QA Gate - Functional Suite (32 checks)'
        run: npx tsx scripts/qa/functional_suite.ts

      - name: 'QA Gate - Editor Engine Suite (12 checks)'
        run: npx tsx scripts/qa/editor_engine_suite.ts

      - name: 'Build Windows Release Binaries + SHA256SUMS + Manifest'
        env:
          # Signed-in-future-ready hooks: populate WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD in GitHub Secrets
          # and flip FORCE_CODE_SIGNING to 'true' once the Authenticode / Azure Trusted Signing cert is active.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          WIN_TIMESTAMP_SERVER: 'http://timestamp.digicert.com'
          FORCE_CODE_SIGNING: ${{ secrets.WIN_CSC_LINK != '' && 'true' || 'false' }}
          ALLOW_UNSIGNED_DEV_BUILDS: ${{ secrets.WIN_CSC_LINK == '' && 'true' || 'false' }}
        run: npx tsx scripts/build_windows_release.ts

      - name: Build Single-File Portable Executable (electron-builder)
        env:
          FORCE_CODE_SIGNING: 'false'
          ALLOW_UNSIGNED_DEV_BUILDS: 'true'
        run: npx electron-builder --win --x64 --config electron-builder.yml

      - name: Create GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $notes = @(
            "## Local Desk v$version - Windows 10 / 11 (x64)",
            '',
            'QA-gated release: all 44 automated functional checks (21 tools, conversions, real PDF encryption, redaction purge, export verification) passed before this build was published.',
            '',
            '### Downloads',
            "- **Local-Desk-Setup-$version-x64.exe** - native installer (recommended)",
            "- **Local-Desk-Portable-$version-x64.exe** - single-file portable",
            "- **Local-Desk-Portable-$version-win-x64.zip** - portable ZIP bundle",
            '',
            '### Verify',
            'SHA-256 checksums in SHA256SUMS.txt: certutil -hashfile <file> SHA256',
            '',
            '**Note:** binaries are unsigned development builds - SmartScreen may show "More info > Run anyway". Verify hashes against SHA256SUMS.txt.'
          )
          $notes -join "`r`n" | Set-Content -Path release/RELEASE_BODY.md -Encoding UTF8
          gh release create "$env:GITHUB_REF_NAME" --title "Local Desk v$version" --notes-file release/RELEASE_BODY.md --latest "release/Local-Desk-Setup-$version-x64.exe" "release/Local-Desk-Portable-$version-x64.exe" "release/Local-Desk-Portable-$version-win-x64.zip" "release/SHA256SUMS.txt" "release/release-manifest.json" "release/RELEASE_NOTES.md"

      - name: Upload CI Artifacts (traceability copy)
        uses: actions/upload-artifact@v4
        with:
          name: local-desk-windows-x64-release
          path: |
            release/Local-Desk-Setup-*-x64.exe
            release/Local-Desk-Portable-*-x64.exe
            release/Local-Desk-Portable-*-win-x64.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/RELEASE_NOTES.md
          if-no-files-found: error
